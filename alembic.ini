
# ============================================
# THE INVISIBLE HEALER
# Phase 04 - Alembic Configuration
# ============================================

[alembic]

# Location of migration environment.
script_location = %(here)s/alembic

# Add project root to the Python import path.
prepend_sys_path = %(here)s

# Migration file naming convention.
# Example: 0002_create_admin_users.py
file_template = %%(rev)s_%%(slug)s

# Migration path separator.
path_separator = os

# Database URL is intentionally absent.
#
# The migration environment reads DATABASE_URL
# through the existing Pydantic Settings class.
#
# Never put PostgreSQL passwords in this file.

# ============================================
# LOGGING
# ============================================

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
