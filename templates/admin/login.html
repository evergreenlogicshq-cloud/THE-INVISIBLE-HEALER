
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Admin Login | {{ app_name }}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='/css/admin.css') }}"
    >

    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f4f7f8;
            padding: 24px;
        }

        .login-card {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            border: 1px solid #e1e8eb;
            border-radius: 16px;
            padding: 36px;
            box-shadow: 0 12px 36px rgba(0,0,0,.06);
        }

        .login-brand {
            color: #182a30;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: .04em;
            margin-bottom: 28px;
        }

        .login-title {
            font-size: 28px;
            margin: 0 0 8px;
            color: #182a30;
        }

        .login-description {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .login-field {
            margin-bottom: 20px;
        }

        .login-field label {
            display: block;
            color: #334155;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .login-field input {
            width: 100%;
            min-height: 46px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 15px;
            box-sizing: border-box;
        }

        .login-field input:focus {
            outline: 2px solid #267b83;
            outline-offset: 2px;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            background: #182a30;
            color: #fff;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .login-button:hover {
            background: #294951;
        }

        .login-error {
            background: #fff1f2;
            border: 1px solid #fecdd3;
            color: #9f1239;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .login-footer {
            font-size: 12px;
            text-align: center;
            color: #64748b;
            margin-top: 24px;
        }
    </style>
</head>

<body class="login-page">

    <main class="login-card">

        <div class="login-brand">
            THE INVISIBLE HEALER
        </div>

        <h1 class="login-title">
            Admin Sign In
        </h1>

        <p class="login-description">
            Sign in to access the administration workspace.
        </p>

        {% if error %}
        <div
            class="login-error"
            role="alert"
        >
            {{ error }}
        </div>
        {% endif %}

        <form
            method="post"
            action="{{ url_for('admin_login') }}"
        >

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token }}"
            >

            <div class="login-field">
                <label for="email">
                    Email address
                </label>

                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="username"
                    maxlength="254"
                    required
                    autofocus
                >
            </div>

            <div class="login-field">
                <label for="password">
                    Password
                </label>

                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-button"
            >
                Sign In
            </button>

        </form>

        <p class="login-footer">
            Authorized administrators only.
        </p>

    </main>

</body>
</html>
